<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MainStage">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<title>Submissions — MainStage Athletes</title>
<style>
.app{max-width:560px;margin:auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;padding:6px 0 12px}
.crumb{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.crumb .dim{color:var(--ms-muted)}
.crumb .lit{color:var(--ms-gold-bright)}
.screenTitle{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:3px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.chip{width:56px;height:56px;border-radius:16px;background:var(--ms-surface-2);border:1px solid var(--ms-border);color:var(--ms-gold);display:flex;align-items:center;justify-content:center;font-size:24px}
.empty h2{margin:0;font-size:20px;font-weight:700}
.empty p{margin:0;font-size:13px;line-height:1.55;color:var(--ms-muted);max-width:300px}
.back{margin-top:14px;width:auto;padding:0 26px}
</style>
</head><body>
<main class="app">
  <header class="head">
    <a class="chipbtn" href="/" aria-label="MainStage home">‹</a>
    <div><div class="crumb"><span class="dim">MAINSTAGE</span> <span class="dim">·</span> <span class="lit">SUBMISSIONS</span></div><div class="screenTitle">Submissions</div></div>
    <span></span>
  </header>
  <div class="empty">
    <span class="chip">+</span>
    <h2>In progress</h2>
    <p>Submissions is coming to MainStage Athletes. Feature requests are in the queue.</p>
    <a class="btn btn-outline back" href="/">BACK TO MAINSTAGE</a>
  </div>
</main>
</body></html>

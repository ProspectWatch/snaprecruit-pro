<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07182d"><title>SnapRecruit Pro</title><style>:root{--n:#07182d;--g:#d4af37;--g2:#f3dc87;--m:#9db0c6;--l:#284b6c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#183c64 0,#07182d 36%,#020912 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}header{padding:14px 18px;border-bottom:1px solid var(--l);background:rgba(7,24,45,.96)}.top{max-width:1000px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border:2px solid var(--g);border-radius:13px;display:grid;place-items:center;color:var(--g);font-weight:900}.brand h1{margin:0;font-size:20px}.brand small{color:var(--m)}.version{color:var(--g2);font-size:12px;border:1px solid #496d91;border-radius:999px;padding:8px 11px}main{max-width:1000px;margin:auto;padding:18px}.panel{background:linear-gradient(180deg,rgba(13,39,71,.97),rgba(5,18,34,.97));border:1px solid var(--l);border-radius:18px;padding:16px}.upload{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--g),var(--g2));color:#181109}.secondary{background:#173b5f;color:#fff;border:1px solid #315d86}.danger{background:#48232c;color:#ffd9df;border:1px solid #7d4450}input[type=file]{display:none}.status{color:var(--m);font-size:13px;margin:10px 0}.progress{height:8px;background:#03101f;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .2s}.work{display:none;grid-template-columns:320px 1fr;gap:18px}.shot{width:100%;max-height:620px;object-fit:contain;border-radius:14px;background:#020912}.counter{color:var(--g2);font-weight:800;margin-bottom:10px}.field{margin-bottom:12px}label{font-size:11px;color:var(--g2);font-weight:800;text-transform:uppercase;letter-spacing:.07em}input[type=text]{width:100%;margin-top:5px;background:#0e2b4d;color:#fff;border:1px solid #315979;border-radius:10px;padding:11px;font-size:17px}.options{display:grid;gap:9px;margin-top:14px}.option{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d2a49;border:1px solid #315979;border-radius:12px;padding:11px}.option span{font-size:17px;word-break:break-all}.option button{white-space:nowrap}.nav{display:flex;gap:10px;margin-top:16px}.nav>*{flex:1}.done{text-align:center;padding:40px 10px}.hint{color:var(--m);font-size:13px;line-height:1.45}@media(max-width:760px){.work{grid-template-columns:1fr}.shot{max-height:420px}.version{display:none}}</style></head><body><header><div class="top"><div class="brand"><div class="logo">SR</div><div><h1>SnapRecruit Pro</h1><small>Prospect Watch recruiting operations</small></div></div><div class="version">WORKFLOW BUILD 007</div></div></header><main><section class="panel"><div class="upload"><label class="btn primary" for="files">Choose Screenshots</label><input id="files" type="file" accept="image/*" multiple><button id="scan" class="btn secondary">Scan Names</button><button id="reset" class="btn danger">Reset</button></div><div id="status" class="status">Choose screenshots to begin.</div><div class="progress"><div id="bar" class="bar"></div></div><div id="empty" class="done"><h2>Simple Snapchat workflow</h2><p class="hint">Upload screenshots, scan names, tap a username option to copy it and open Snapchat, then return and tap Next Athlete.</p></div><div id="work" class="work"><div><div id="counter" class="counter"></div><img id="shot" class="shot"></div><div><div class="field"><label>Athlete Name<input id="name" type="text"></label></div><div class="field"><label>Detected Instagram<input id="ig" type="text"></label></div><div class="field"><label>Detected Snapchat<input id="snap" type="text"></label></div><div id="options" class="options"></div><div class="nav"><button id="notfound" class="btn danger">Not Found</button><button id="next" class="btn primary">Next Athlete</button></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const $=s=>document.querySelector(s),state={items:[],i:0};function cleanHandle(v){return(v||'').trim().replace(/^@/,'').replace(/[^A-Za-z0-9._-]/g,'').replace(/[._-]+$/,'').slice(0,30)}function pickName(lines){const bad=/follow|followers|following|posts|message|profile|suggested|contact|instagram|prospect|watch/i;for(const raw of lines){const s=raw.trim().replace(/[|•]/g,' ').replace(/\s+/g,' ').replace(/^[^A-Za-zÀ-ÿ]+|[^A-Za-zÀ-ÿ.'’-]+$/g,'');if(s.length<3||s.length>40||bad.test(s))continue;if(/^[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+){1,3}$/.test(s))return s}return''}function pickIG(lines){for(const raw of lines){const s=cleanHandle(raw);if(s.length>=3&&/[A-Za-z]/.test(s)&&!/^(profile|private|follow|followers|following|posts|message|instagram|prospectwatch)$/i.test(s))return s}return''}function pickSnap(lines){for(const raw of lines){if(/snap(chat)?|\bsc:/i.test(raw)){const p=raw.split(/[:\s]+/).map(cleanHandle).filter(x=>x.length>=3);if(p.length)return p.at(-1)}}return''}async function topCrop(file){const b=await createImageBitmap(file),w=b.width,h=b.height,c=document.createElement('canvas'),hh=h*.34,sc=Math.min(1,1000/w);c.width=Math.round(w*sc);c.height=Math.round(hh*sc);const g=c.getContext('2d',{alpha:false});g.filter='grayscale(1) contrast(1.4)';g.drawImage(b,0,0,w,hh,0,0,c.width,c.height);return c}function variants(item){const n=(item.name||'').trim().toLowerCase().replace(/[^a-zà-ÿ' -]/g,'').split(/\s+/).filter(Boolean);const first=n[0]||'',last=n.length>1?n.at(-1):'';const base=[];if(first&&last){base.push(first+'.'+last,first+last,first+'_'+last,first+'-'+last)}if(item.ig)base.push(item.ig);if(item.snap)base.push(item.snap);return [...new Set(base.map(cleanHandle).filter(Boolean))]}async function openSnap(v){try{await navigator.clipboard.writeText(v)}catch{}const web='https://www.snapchat.com/add/'+encodeURIComponent(v);window.location.href='snapchat://add/'+encodeURIComponent(v);setTimeout(()=>{window.location.href=web},700)}function render(){if(!state.items.length){$('#empty').style.display='block';$('#work').style.display='none';return}const x=state.items[state.i];$('#empty').style.display='none';$('#work').style.display='grid';$('#counter').textContent=`Athlete ${state.i+1} of ${state.items.length}`;$('#shot').src=x.url;$('#name').value=x.name||'';$('#ig').value=x.ig||'';$('#snap').value=x.snap||'';$('#options').innerHTML=variants(x).map(v=>`<div class="option"><span>${v}</span><button class="btn secondary" data-open="${v}">Copy + Open Snapchat</button></div>`).join('')||'<div class="hint">Enter the athlete name to generate username options.</div>'}function sync(){const x=state.items[state.i];x.name=$('#name').value;x.ig=$('#ig').value;x.snap=$('#snap').value;render()}$('#files').onchange=e=>{state.items=[...e.target.files].map(f=>({file:f,url:URL.createObjectURL(f),name:'',ig:'',snap:'',status:'pending'}));state.i=0;$('#status').textContent=`${state.items.length} screenshot(s) ready.`;render()};$('#scan').onclick=async()=>{if(!state.items.length)return alert('Choose screenshots first.');$('#scan').disabled=true;let w;try{$('#status').textContent='Loading OCR engine…';w=await Tesseract.createWorker('eng');for(let i=0;i<state.items.length;i++){const x=state.items[i];$('#status').textContent=`Scanning ${i+1} of ${state.items.length}…`;const r=await w.recognize(await topCrop(x.file)),lines=(r.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);x.name=pickName(lines);x.ig=pickIG(lines);x.snap=pickSnap(lines);$('#bar').style.width=`${Math.round((i+1)/state.items.length*100)}%`;if(i===state.i)render()}$('#status').textContent='Scan complete. Edit the name if needed, then use the options.'}catch(e){$('#status').textContent='OCR failed: '+e.message}finally{if(w)await w.terminate();$('#scan').disabled=false}};$('#name').oninput=sync;$('#ig').oninput=sync;$('#snap').oninput=sync;$('#options').onclick=e=>{const v=e.target.dataset.open;if(v)openSnap(v)};$('#next').onclick=()=>{if(state.i<state.items.length-1){state.i++;render()}else{$('#work').style.display='none';$('#empty').style.display='block';$('#empty').innerHTML=`<h2>Session complete</h2><p>${state.items.length} athlete(s) processed.</p>`}};$('#notfound').onclick=()=>{$('#status').textContent=`Marked athlete ${state.i+1} as not found.`;$('#next').click()};$('#reset').onclick=()=>{state.items=[];state.i=0;$('#bar').style.width='0';$('#status').textContent='Choose screenshots to begin.';$('#empty').innerHTML='<h2>Simple Snapchat workflow</h2><p class="hint">Upload screenshots, scan names, tap a username option to copy it and open Snapchat, then return and tap Next Athlete.</p>';render()};render();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SnapRecruit"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/snaprecruit-icon.svg"><link rel="apple-touch-icon" href="/snaprecruit-icon.svg"><title>SnapRecruit</title><style>:root{--bg:#03070d;--navy:#06111f;--panel:#0b1420;--panel2:#101b29;--line:#263548;--bronze:#b38a3e;--bronze2:#c6a45f;--bronze3:#8d6b31;--text:#e7ebf0;--muted:#8d99a8;--danger:#8d4852}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 50% 0,#102338 0,#06111f 34%,#03070d 78%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100%}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 30px)}.brandbar{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;margin-bottom:14px}.brandmark{width:48px;height:48px;border-radius:14px;background:#091523;border:1px solid #3a4a5f;padding:5px}.brandname{font-size:20px;font-weight:850;letter-spacing:.01em}.tagline{font-size:11px;color:var(--bronze2);letter-spacing:.14em;text-transform:uppercase;margin-top:2px}.count{text-align:right;color:var(--muted);font-size:14px}.progress{height:5px;background:#101a27;border-radius:99px;overflow:hidden;margin-bottom:16px}.progressbar{height:100%;width:0;background:linear-gradient(90deg,var(--bronze3),var(--bronze2));transition:width .25s}.upload,.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 38px rgba(0,0,0,.22)}.badge{display:inline-block;background:#0b1725;border:1px solid #35455a;border-radius:999px;padding:7px 11px;color:var(--bronze2);font-size:12px;margin-bottom:15px}.upload input{display:none}.choose,.scan,.resume{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:850}.choose{background:#d9dde2;color:#0b1017;text-align:center}.scan{margin-top:10px;background:linear-gradient(135deg,var(--bronze3),var(--bronze2));color:#100d08}.resume{margin-top:10px;background:#152235;color:#e9edf2;border:1px solid #34475f}.status{color:#a7b0bc;margin-top:11px;line-height:1.4}.tiny{font-size:12px;color:#768293;margin-top:9px}.review{display:none}.shot{width:100%;max-height:390px;object-fit:contain;background:#04070b;border:1px solid #172130;border-radius:18px;margin-bottom:15px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;color:#aab3bf;font-size:14px;margin-bottom:7px}.field input{width:100%;background:#05090f;border:1px solid #344356;border-radius:12px;color:var(--text);font-size:20px;font-weight:720;padding:13px}.section{font-size:21px;font-weight:850;margin:23px 0 13px}.option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#8f6d32,#b38a3e);color:#f5efe3;border:1px solid #c0a061;border-radius:18px;padding:17px 18px;margin:0 0 11px;text-align:left;box-shadow:0 8px 18px rgba(0,0,0,.16)}.option:active{background:#775a2b;transform:scale(.995)}.handle{font-size:19px;font-weight:850;overflow-wrap:anywhere}.action{font-size:13px;font-weight:800;white-space:nowrap;opacity:.88}.plain{width:100%;background:#121c29;border:1px solid #2b394b;color:#d8dee6;border-radius:16px;padding:15px;font-size:16px;margin-top:3px}.bottom{position:sticky;bottom:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px;padding:9px;background:rgba(3,7,13,.9);backdrop-filter:blur(12px);border:1px solid #202d3d;border-radius:18px}.bottom button{border:1px solid #293748;border-radius:14px;background:#111b28;color:#e1e6ec;padding:14px 6px;font-size:14px}.bottom button:first-child{border-color:#6f603e;color:#d8c08d}.done{display:none;text-align:center;padding:65px 20px}.done h2{font-size:29px}.error{color:#d88c95}@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.brandbar{grid-template-columns:44px 1fr auto}.brandmark{width:44px;height:44px}.brandname{font-size:18px}.handle{font-size:18px}}</style></head><body><main class="app"><header class="brandbar"><img class="brandmark" src="/snaprecruit-icon.svg" alt=""><div><div class="brandname">SnapRecruit</div><div class="tagline">Find • Connect • Recruit</div></div><div class="count" id="count">0 remaining</div></header><div class="progress"><div class="progressbar" id="progressbar"></div></div><section class="upload" id="upload"><div class="badge">CLAUDE READER • NIGHT BUILD 014</div><label class="choose" for="files">Choose Instagram Screenshots</label><input id="files" type="file" accept="image/*" multiple><button class="scan" id="scan">Scan Screenshots</button><button class="resume" id="resume" style="display:none">Resume Saved Session</button><div class="status" id="status">Choose screenshots to begin.</div><div class="tiny">Screenshots and progress remain saved on this device.</div></section><section class="review" id="review"><img class="shot" id="shot"><div class="card"><div class="field"><label>Instagram handle</label><input id="ig" autocomplete="off" autocapitalize="none"></div><div class="field"><label>Full name</label><input id="name" autocomplete="off"></div><div class="field"><label>Snapchat handle</label><input id="snap" autocomplete="off" autocapitalize="none" placeholder="Not detected"></div></div><div class="section">Snapchat search options</div><div id="options"></div><button class="plain" id="openOnly">Open Snapchat without copying</button><div class="bottom"><button id="added">✓<br>Added</button><button id="notFound">✕<br>Not Found</button><button id="skip">≫<br>Skip</button></div></section><section class="done" id="done"><h2>Session Complete</h2><p id="summary"></p><button class="choose" id="newSession">Start New Session</button></section></main><script>const $=s=>document.querySelector(s);const DB='snaprecruit-v12',STORE='session';const state={items:[],index:0,added:0,notFound:0,skipped:0};function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function save(){const db=await openDB(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({items:state.items.map(x=>({file:x.file,ig:x.ig,name:x.name,snap:x.snap})),index:state.index,added:state.added,notFound:state.notFound,skipped:state.skipped},'current');return new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)})}async function load(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get('current');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}async function clearSaved(){const db=await openDB(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('current');return new Promise(r=>tx.oncomplete=r)}function cleanHandle(s){return String(s||'').trim().replace(/^@/,'').replace(/[^A-Za-z0-9._-]/g,'').slice(0,30)}function cleanName(s){return String(s||'').trim().replace(/\b(she\/her|he\/him|they\/them)\b/ig,'').replace(/\s+/g,' ').replace(/^[\s._-]+|[\s._-]+$/g,'').slice(0,60)}function validHandle(s){return s&&s.length>2&&/[A-Za-z]/.test(s)&&/^[A-Za-z0-9._-]+$/.test(s)}function suggestions(){const name=cleanName($('#name').value),ig=cleanHandle($('#ig').value),snap=cleanHandle($('#snap').value),parts=name.toLowerCase().split(/\s+/).filter(Boolean),out=[];if(snap)out.push(snap);if(parts.length>=2){const f=parts[0],l=parts.at(-1);out.push(`${f}.${l}`,`${f}_${l}`,`${f}-${l}`,`${f}${l}`)}if(ig)out.push(ig);return[...new Set(out.filter(validHandle))]}async function launchSnapchat(handle){if(handle)await navigator.clipboard.writeText(handle);const a=document.createElement('a');a.href='snapchat://';a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}function renderOptions(){const opts=suggestions();$('#options').innerHTML=opts.length?opts.map(h=>`<button class="option" data-h="${h}"><span class="handle">${h}</span><span class="action">COPY + OPEN ↗</span></button>`).join(''):'<div class="card" style="color:#8994a2">Correct the fields above to create suggestions.</div>'}function updateProgress(){const total=state.items.length,done=Math.min(state.index,total);$('#progressbar').style.width=total?`${done/total*100}%`:'0%';$('#count').textContent=total?`${total-done} remaining`:'0 remaining'}function show(){updateProgress();if(state.index>=state.items.length){$('#review').style.display='none';$('#upload').style.display='none';$('#done').style.display='block';$('#summary').textContent=`${state.added} added • ${state.notFound} not found • ${state.skipped} skipped`;clearSaved();return}const x=state.items[state.index];$('#review').style.display='block';$('#upload').style.display='none';$('#done').style.display='none';$('#shot').src=URL.createObjectURL(x.file);$('#ig').value=x.ig||'';$('#name').value=x.name||'';$('#snap').value=x.snap||'';renderOptions();scrollTo(0,0)}async function next(type){const x=state.items[state.index];x.ig=$('#ig').value;x.name=$('#name').value;x.snap=$('#snap').value;if(type==='added')state.added++;if(type==='notFound')state.notFound++;if(type==='skip')state.skipped++;state.index++;await save();show()}async function fileToDataUrl(file){const bmp=await createImageBitmap(file);const max=1500,scale=Math.min(1,max/bmp.width),c=document.createElement('canvas');c.width=Math.round(bmp.width*scale);c.height=Math.round(bmp.height*scale);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.86)}async function readProfile(file){const image=await fileToDataUrl(file);const r=await fetch('/api/read-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Reader failed');return data}$('#files').onchange=async e=>{state.items=[...e.target.files].map(file=>({file,ig:'',name:'',snap:''}));state.index=state.added=state.notFound=state.skipped=0;$('#status').textContent=`${state.items.length} screenshot(s) ready.`;updateProgress();await save()};$('#scan').onclick=async()=>{if(!state.items.length)return alert('Choose screenshots first.');$('#scan').disabled=true;$('#status').classList.remove('error');try{for(let i=0;i<state.items.length;i++){const x=state.items[i];$('#status').textContent=`Reading ${i+1} of ${state.items.length} with Claude vision…`;const data=await readProfile(x.file);x.ig=cleanHandle(data.instagram);x.name=cleanName(data.full_name);x.snap=cleanHandle(data.snapchat);await save()}$('#status').textContent='Ready.';show()}catch(e){$('#status').classList.add('error');$('#status').textContent='Reader error: '+e.message}finally{$('#scan').disabled=false}};$('#options').onclick=e=>{const b=e.target.closest('[data-h]');if(b)launchSnapchat(b.dataset.h)};['ig','name','snap'].forEach(id=>$('#'+id).addEventListener('input',async()=>{const x=state.items[state.index];x[id==='ig'?'ig':id]=$('#'+id).value;renderOptions();await save()}));$('#openOnly').onclick=()=>launchSnapchat('');$('#added').onclick=()=>next('added');$('#notFound').onclick=()=>next('notFound');$('#skip').onclick=()=>next('skip');$('#newSession').onclick=async()=>{await clearSaved();location.href='/'};$('#resume').onclick=()=>show();(async()=>{const saved=await load();if(saved?.items?.length){Object.assign(state,saved);$('#resume').style.display='block';$('#status').textContent=`Saved session found: ${state.items.length-state.index} remaining.`;updateProgress()}})();</script></body></html>

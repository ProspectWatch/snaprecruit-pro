<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>SnapRecruit Pro</title><style>:root{--bg:#000;--card:#111;--line:#242424;--gold:#ffdf3d;--muted:#9a9a9a}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 24px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{width:58px;height:58px;border-radius:50%;border:1px solid #333;background:#151515;color:#fff;font-size:34px}.title{font-size:25px;font-weight:800}.count{color:#aaa;font-size:18px}.upload{background:#111;border:1px solid #2a2a2a;border-radius:18px;padding:18px;margin-bottom:18px}.upload input{display:none}.choose,.scan{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:800}.choose{background:#fff;color:#000;text-align:center}.scan{margin-top:10px;background:#ffdf3d;color:#000}.status{color:#aaa;margin-top:10px}.review{display:none}.shot{width:100%;max-height:360px;object-fit:contain;background:#080808;border-radius:18px;margin-bottom:16px}.card{background:#111;border:1px solid #232323;border-radius:20px;padding:18px}.field{margin-bottom:16px}.field label{display:block;color:#aaa;font-size:16px;margin-bottom:8px}.field input{width:100%;background:#000;border:1px solid #333;border-radius:12px;color:#fff;font-size:21px;font-weight:700;padding:14px}.section{font-size:23px;font-weight:800;margin:24px 0 14px}.option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--gold);color:#000;border:0;border-radius:22px;padding:19px 20px;margin:0 0 13px;text-align:left}.option .handle{font-size:21px;font-weight:800;overflow-wrap:anywhere}.option .action{font-size:16px;font-weight:800;white-space:nowrap}.plain{width:100%;background:#151515;border:1px solid #242424;color:#fff;border-radius:18px;padding:16px;font-size:18px;margin-top:4px}.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.bottom button{border:0;border-radius:18px;background:#151515;color:#fff;padding:17px 8px;font-size:16px}.done{display:none;text-align:center;padding:70px 20px}.done h2{font-size:30px}.badge{display:inline-block;background:#1b1b1b;border:1px solid #333;border-radius:999px;padding:8px 12px;color:#bbb;font-size:13px;margin-bottom:14px}@media(max-width:520px){.app{padding-left:14px;padding-right:14px}.title{font-size:22px}.count{font-size:16px}.option .handle{font-size:19px}.option .action{font-size:14px}}</style></head><body><main class="app"><div class="top"><button class="back" id="back">‹</button><div class="title">Needs Review</div><div class="count" id="count">0 remaining</div></div><div class="upload" id="upload"><div class="badge">ORIGINAL WORKFLOW BUILD 008</div><label class="choose" for="files">Choose Instagram Screenshots</label><input id="files" type="file" accept="image/*" multiple><button class="scan" id="scan">Scan</button><div class="status" id="status">Choose screenshots to begin.</div></div><section class="review" id="review"><img class="shot" id="shot"><div class="card"><div class="field"><label>Instagram</label><input id="ig" autocomplete="off"></div><div class="field"><label>Full Name</label><input id="name" autocomplete="off" placeholder="Optional"></div><div class="field"><label>Snapchat</label><input id="snap" autocomplete="off" placeholder="Not detected"></div></div><div class="section">Search Suggestions</div><div id="options"></div><button class="plain" id="openOnly">Open Snapchat Without Copying</button><div class="bottom"><button id="added">✓<br>Added</button><button id="notFound">✕<br>Not Found</button><button id="skip">≫<br>Skip</button></div></section><section class="done" id="done"><h2>Session Complete</h2><p id="summary"></p><button class="choose" onclick="location.reload()">Start New Session</button></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const $=s=>document.querySelector(s);const state={items:[],index:0,added:0,notFound:0,skipped:0};const banned=/^(follow|following|followers|posts|message|profile|private|suggested|instagram|home|search|reels|meta)$/i;function cleanHandle(s){return String(s||'').trim().replace(/^@/,'').replace(/[^A-Za-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'').slice(0,30)}function validHandle(s){return s&&s.length>2&&!banned.test(s)&&/[A-Za-z]/.test(s)&&/^[A-Za-z0-9._-]+$/.test(s)}function cleanName(s){return String(s||'').replace(/\b(she\/her|he\/him|they\/them)\b/ig,'').replace(/[^A-Za-zÀ-ÿ'’.-]+/g,' ').replace(/\s+/g,' ').trim()}function pickName(lines){for(const raw of lines){const s=cleanName(raw);if(s.length<3||s.length>38||/follow|message|profile|school|class of|volleyball|soccer|lacrosse|university|college/i.test(s))continue;if(/^[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+){1,3}$/.test(s))return s}return''}function detectSnap(lines){for(const raw of lines){const m=raw.match(/(?:👻|\bsc\.?\s*[:\-]?|snap(?:chat)?\s*[:\-]?)[\s@]*([A-Za-z0-9._-]{3,30})/i);if(m&&validHandle(cleanHandle(m[1])))return cleanHandle(m[1])}return''}function pickIG(lines){for(const raw of lines){const s=cleanHandle(raw);if(validHandle(s)&&!/^\d+$/.test(s)&&!/(follow|message|profile|prospectwatch)/i.test(s))return s}return''}async function crop(file,kind){const b=await createImageBitmap(file),w=b.width,h=b.height;let x=.02*w,y=.01*h,ww=.82*w,hh=.105*h,max=1400;if(kind==='profile'){x=.02*w;y=.07*h;ww=.94*w;hh=.30*h;max=1200}const scale=Math.min(1,max/ww),c=document.createElement('canvas');c.width=Math.round(ww*scale);c.height=Math.round(hh*scale);const g=c.getContext('2d',{alpha:false});g.filter=kind==='ig'?'grayscale(1) contrast(1.75)':'grayscale(1) contrast(1.35)';g.drawImage(b,x,y,ww,hh,0,0,c.width,c.height);return c}function suggestions(){const name=cleanName($('#name').value),ig=cleanHandle($('#ig').value),snap=cleanHandle($('#snap').value),parts=name.toLowerCase().split(/\s+/).filter(Boolean),out=[];if(ig)out.push(ig);if(snap)out.push(snap);if(parts.length>=2){const f=parts[0],l=parts.at(-1);out.push(`${f}.${l}`,`${f}_${l}`,`${f}-${l}`,`${f}${l}`)}return [...new Set(out.filter(validHandle))]}async function choose(handle){await navigator.clipboard.writeText(handle);const web=`https://www.snapchat.com/add/${encodeURIComponent(handle)}`;window.location.href=`snapchat://add/${encodeURIComponent(handle)}`;setTimeout(()=>{window.location.href=web},900)}function renderOptions(){const box=$('#options');const opts=suggestions();box.innerHTML=opts.length?opts.map(h=>`<button class="option" data-h="${h}"><span class="handle">${h}</span><span class="action">Copy + Open ↗</span></button>`).join(''):'<div class="card" style="color:#999">Enter a name or detected handle to create suggestions.</div>'}function show(){if(state.index>=state.items.length){$('#review').style.display='none';$('#upload').style.display='none';$('#done').style.display='block';$('#summary').textContent=`${state.added} added • ${state.notFound} not found • ${state.skipped} skipped`;$('#count').textContent='0 remaining';return}const x=state.items[state.index];$('#review').style.display='block';$('#upload').style.display='none';$('#shot').src=x.url;$('#ig').value=x.ig||'';$('#name').value=x.name||'';$('#snap').value=x.snap||'';$('#count').textContent=`${state.items.length-state.index} remaining`;renderOptions();scrollTo(0,0)}function next(type){if(type==='added')state.added++;if(type==='notFound')state.notFound++;if(type==='skip')state.skipped++;state.index++;show()}$('#files').onchange=e=>{state.items=[...e.target.files].map(file=>({file,url:URL.createObjectURL(file),ig:'',name:'',snap:''}));$('#status').textContent=`${state.items.length} screenshot(s) ready.`;$('#count').textContent=`${state.items.length} remaining`};$('#scan').onclick=async()=>{if(!state.items.length)return alert('Choose screenshots first.');$('#scan').disabled=true;let w;try{$('#status').textContent='Loading reader…';w=await Tesseract.createWorker('eng');for(let i=0;i<state.items.length;i++){const x=state.items[i];$('#status').textContent=`Reading ${i+1} of ${state.items.length}…`;await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-'});const a=await w.recognize(await crop(x.file,'ig'));const igLines=(a.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);x.ig=pickIG(igLines);await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});const b=await w.recognize(await crop(x.file,'profile'));const lines=(b.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);x.name=pickName(lines);x.snap=detectSnap(lines)}$('#status').textContent='Ready.';show()}catch(e){$('#status').textContent='Reader error: '+e.message}finally{if(w)await w.terminate();$('#scan').disabled=false}};$('#options').onclick=e=>{const b=e.target.closest('[data-h]');if(b)choose(b.dataset.h)};['ig','name','snap'].forEach(id=>$('#'+id).addEventListener('input',renderOptions));$('#openOnly').onclick=()=>window.location.href='snapchat://';$('#added').onclick=()=>next('added');$('#notFound').onclick=()=>next('notFound');$('#skip').onclick=()=>next('skip');$('#back').onclick=()=>{if(state.index>0){state.index--;show()}else history.back()};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07182d"><title>SnapRecruit Pro</title><style>:root{--n:#07182d;--p:#0d2747;--g:#d4af37;--g2:#f3dc87;--m:#9db0c6;--l:#284b6c;--snap:#fffc00}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0,#183c64 0,#07182d 38%,#020912 100%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:5;background:rgba(7,24,45,.96);border-bottom:1px solid var(--l)}.top{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;border:2px solid var(--g);border-radius:14px;display:grid;place-items:center;color:var(--g);font-weight:900}.brand h1{margin:0;font-size:20px}.brand small{color:var(--m)}.version{font-size:12px;color:var(--g2);border:1px solid #496d91;border-radius:999px;padding:8px 11px;font-weight:800}main{max-width:1200px;margin:auto;padding:16px}.panel,.card{background:linear-gradient(180deg,rgba(13,39,71,.97),rgba(5,18,34,.98));border:1px solid var(--l);border-radius:18px;box-shadow:0 16px 36px rgba(0,0,0,.24)}.panel{padding:16px;margin-bottom:14px}.drop{border:2px dashed #4a7198;border-radius:16px;padding:22px;text-align:center}.hint{font-size:13px;color:var(--m);line-height:1.4}.btn{font:inherit;border:0;border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--g),var(--g2));color:#171109}.secondary{background:#173b5f;color:#fff;border:1px solid #315d86}.danger{background:#48232c;color:#ffd9df;border:1px solid #7d4450}.wide{width:100%}input[type=file]{display:none}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.status{margin-top:12px;background:#06182d;border:1px solid var(--l);border-radius:12px;padding:11px;color:var(--m)}.progress{height:8px;background:#03101f;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--g),var(--g2))}.queue{display:grid;gap:14px}.card{padding:14px;display:grid;grid-template-columns:110px 1fr;gap:14px}.thumb{width:110px;height:150px;object-fit:cover;border-radius:12px;background:#020912}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{font-size:11px;color:var(--g2);font-weight:800;text-transform:uppercase;letter-spacing:.07em}input[type=text]{width:100%;margin-top:5px;background:#0e2b4d;color:#fff;border:1px solid #315979;border-radius:10px;padding:10px;font-size:16px}.options{grid-column:1/-1;margin-top:8px}.options h3{margin:0 0 8px;font-size:14px;color:#fff}.optionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.snapBtn{background:var(--snap);color:#000;border-radius:11px;border:0;padding:12px;text-align:left;font-weight:850;cursor:pointer}.snapBtn span{display:block;font-size:11px;opacity:.65;margin-bottom:3px}.empty{padding:40px;text-align:center;color:var(--m);border:1px dashed var(--l);border-radius:16px}@media(max-width:700px){.version{display:none}.card{grid-template-columns:76px 1fr}.thumb{width:76px;height:105px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.optionGrid{grid-template-columns:1fr}.brand h1{font-size:19px}}</style></head><body><header><div class="top"><div class="brand"><div class="logo">SR</div><div><h1>SnapRecruit Pro</h1><small>Prospect Watch recruiting operations</small></div></div><div class="version">SNAPCHAT BUILD 006</div></div></header><main><section class="panel"><div class="drop"><div style="font-size:38px">📸</div><strong>Select Instagram screenshots</strong><p class="hint">Detect the athlete name, Instagram username and Snapchat username, then generate common Snapchat username options.</p><label class="btn primary wide" for="files">Choose Screenshots</label><input id="files" type="file" accept="image/*" multiple></div><div class="status"><div id="status">Ready.</div><div class="progress"><div id="bar" class="bar"></div></div></div><div class="row"><button id="scan" class="btn primary">Scan</button><button id="clear" class="btn danger">Clear</button></div></section><section class="queue" id="queue"><div class="empty">Upload screenshots to begin.</div></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const $=s=>document.querySelector(s),state=[];const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function cleanUser(v){return(v||'').trim().replace(/^@/,'').replace(/\.{2,}$/,'').replace(/^[._-]+|[._-]+$/g,'').replace(/\s+/g,'').replace(/[^A-Za-z0-9._-]/g,'').slice(0,30)}function cleanName(v){return(v||'').trim().replace(/[^A-Za-zÀ-ÿ'’ -]/g,' ').replace(/\s+/g,' ').replace(/^ | $/g,'')}function pickName(lines){const bad=/follow|message|profile|suggested|posts|followers|following|contact|someone|prospect|watch|snapchat|instagram/i;for(const raw of lines){const s=cleanName(raw);if(s.length<3||s.length>40||bad.test(s))continue;if(/^[A-Za-zÀ-ÿ'’.-]+(?:\s+[A-Za-zÀ-ÿ'’.-]+){1,3}$/.test(s))return s}return''}function pickIG(lines){const bad=/follow|followers|following|posts|message|profile|prospectwatch/i;for(const raw of lines){const s=cleanUser(raw);if(s.length>=3&&/[A-Za-z]/.test(s)&&!bad.test(s))return s}return''}function pickSnap(lines){for(const raw of lines){if(/snap(chat)?|\bsc\s*:/i.test(raw)){const parts=raw.split(/[:\s]+/).map(cleanUser).filter(x=>x.length>=3);if(parts.length)return parts.at(-1)}}return''}function makeOptions(name,ig,snap){const parts=cleanName(name).toLowerCase().split(/\s+/).filter(Boolean),first=parts[0]||'',last=parts.at(-1)||'';const vals=[];if(first&&last){vals.push({label:'First.last',value:`${first}.${last}`},{label:'Firstlast',value:`${first}${last}`},{label:'first_last',value:`${first}_${last}`},{label:'first-last',value:`${first}-${last}`})}if(ig)vals.push({label:'Instagram',value:cleanUser(ig)});if(snap)vals.push({label:'Detected Snapchat',value:cleanUser(snap)});const seen=new Set;return vals.filter(x=>x.value&&!seen.has(x.value)&&(seen.add(x.value),true))}async function crop(file,mode){const b=await createImageBitmap(file),w=b.width,h=b.height;let x=0,y=0,ww=w,hh=.38*h;if(mode==='top'){x=.02*w;y=.02*h;ww=.94*w;hh=.30*h}const sc=Math.min(1,1100/ww),c=document.createElement('canvas');c.width=Math.round(ww*sc);c.height=Math.round(hh*sc);const g=c.getContext('2d',{alpha:false});g.filter='grayscale(1) contrast(1.45)';g.drawImage(b,x,y,ww,hh,0,0,c.width,c.height);return c}function render(){const q=$('#queue');if(!state.length){q.innerHTML='<div class="empty">Upload screenshots to begin.</div>';return}q.innerHTML=state.map((x,i)=>`<article class="card"><img class="thumb" src="${x.url}"><div><div class="fields"><label>Athlete Name<input type="text" data-i="${i}" data-k="name" value="${esc(x.name)}"></label><label>Instagram Username<input type="text" data-i="${i}" data-k="ig" value="${esc(x.ig)}"></label><label class="full">Detected Snapchat<input type="text" data-i="${i}" data-k="snap" value="${esc(x.snap)}"></label><div class="options"><h3>Tap an option to copy it and open Snapchat</h3><div class="optionGrid">${makeOptions(x.name,x.ig,x.snap).map(o=>`<button class="snapBtn" data-open="${esc(o.value)}"><span>${esc(o.label)}</span>${esc(o.value)}</button>`).join('')||'<div class="hint">Enter or correct the athlete name to generate options.</div>'}</div></div></div></div></article>`).join('')}$('#files').addEventListener('change',async e=>{for(const f of [...e.target.files]){await createImageBitmap(f);state.push({file:f,url:URL.createObjectURL(f),name:'',ig:'',snap:''})}render();$('#status').textContent=`${state.length} screenshot(s) ready.`});$('#scan').onclick=async()=>{if(!state.length)return;$('#scan').disabled=true;let w;try{$('#status').textContent='Loading OCR…';w=await Tesseract.createWorker('eng');for(let i=0;i<state.length;i++){const x=state[i];$('#status').textContent=`Scanning ${i+1} of ${state.length}…`;const r=await w.recognize(await crop(x.file,'top')),lines=(r.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);x.ig=pickIG(lines);x.name=pickName(lines);x.snap=pickSnap(lines);render();$('#bar').style.width=`${Math.round((i+1)/state.length*100)}%`}$('#status').textContent='Scan complete.'}catch(e){$('#status').textContent='Scan failed: '+e.message}finally{if(w)await w.terminate();$('#scan').disabled=false}};$('#queue').addEventListener('input',e=>{const i=+e.target.dataset.i,k=e.target.dataset.k;if(Number.isInteger(i)&&k){state[i][k]=e.target.value;render()}});$('#queue').addEventListener('click',async e=>{const v=e.target.closest('[data-open]')?.dataset.open;if(!v)return;try{await navigator.clipboard.writeText(v)}catch{}window.location.href=`https://www.snapchat.com/add/${encodeURIComponent(v)}`});$('#clear').onclick=()=>{state.splice(0);render();$('#status').textContent='Ready.';$('#bar').style.width='0'};render();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020812"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/snaprecruit-icon.svg"><link rel="apple-touch-icon" href="/snaprecruit-icon.svg"><title>SnapRecruit</title><style>:root{--gold:#ffdf3d;--navy:#07182d;--card:#0b111b;--line:#25344a;--muted:#9ca7b8}*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 28px)}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back{width:56px;height:56px;border-radius:50%;border:1px solid #33445e;background:#101722;color:#fff;font-size:33px}.title{font-size:25px;font-weight:850}.count{color:#a8b1bf;font-size:17px}.upload,.card{background:linear-gradient(180deg,#0d1726,#080d15);border:1px solid var(--line);border-radius:21px;padding:18px}.upload input{display:none}.choose,.scan,.resume{display:block;width:100%;border:0;border-radius:15px;padding:15px;font-size:17px;font-weight:850}.choose{background:#fff;color:#000;text-align:center}.scan{margin-top:10px;background:var(--gold);color:#000}.resume{margin-top:10px;background:#172237;color:#fff;border:1px solid #334d70}.status{color:#aab4c3;margin-top:11px;line-height:1.4}.review{display:none}.shot{width:100%;max-height:390px;object-fit:contain;background:#05070b;border-radius:18px;margin-bottom:16px}.field{margin-bottom:15px}.field label{display:block;color:#aeb7c5;font-size:16px;margin-bottom:8px}.field input{width:100%;background:#000;border:1px solid #38475c;border-radius:13px;color:#fff;font-size:21px;font-weight:750;padding:14px}.section{font-size:24px;font-weight:850;margin:25px 0 14px}.option{width:100%;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--gold);color:#000;border:0;border-radius:22px;padding:19px 20px;margin:0 0 13px;text-align:left}.handle{font-size:21px;font-weight:850;overflow-wrap:anywhere}.action{font-size:16px;font-weight:850;white-space:nowrap}.plain{width:100%;background:#141923;border:1px solid #2c3648;color:#fff;border-radius:18px;padding:16px;font-size:18px;margin-top:4px}.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:18px}.bottom button{border:1px solid #222d3d;border-radius:18px;background:#121721;color:#fff;padding:17px 8px;font-size:16px}.done{display:none;text-align:center;padding:70px 20px}.done h2{font-size:30px}.badge{display:inline-block;background:#101827;border:1px solid #35496a;border-radius:999px;padding:8px 12px;color:#e6c957;font-size:13px;margin-bottom:14px}.tiny,.launch-note{font-size:12px;color:#7f8998;margin-top:10px;line-height:1.4}@media(max-width:520px){.app{padding-left:14px;padding-right:14px}.title{font-size:22px}.count{font-size:16px}.handle{font-size:19px}.action{font-size:14px}}</style></head><body><main class="app"><div class="top"><button class="back" id="back">‹</button><div class="title">Needs Review</div><div class="count" id="count">0 remaining</div></div><div class="upload" id="upload"><div class="badge">REGION READER BUILD 011</div><label class="choose" for="files">Choose Instagram Screenshots</label><input id="files" type="file" accept="image/*" multiple><button class="scan" id="scan">Scan Screenshots</button><button class="resume" id="resume" style="display:none">Resume Saved Session</button><div class="status" id="status">Choose screenshots to begin.</div><div class="tiny">Screenshots and progress remain saved on this device.</div></div><section class="review" id="review"><img class="shot" id="shot"><div class="card"><div class="field"><label>Instagram</label><input id="ig" autocomplete="off" autocapitalize="none"></div><div class="field"><label>Full Name</label><input id="name" autocomplete="off"></div><div class="field"><label>Snapchat</label><input id="snap" autocomplete="off" autocapitalize="none" placeholder="Not detected"></div></div><div class="section">Search Suggestions</div><div id="options"></div><button class="plain" id="openOnly">Open Snapchat Without Copying</button><div class="launch-note">A suggestion copies to your clipboard and opens Snapchat itself.</div><div class="bottom"><button id="added">✓<br>Added</button><button id="notFound">✕<br>Not Found</button><button id="skip">≫<br>Skip</button></div></section><section class="done" id="done"><h2>Session Complete</h2><p id="summary"></p><button class="choose" id="newSession">Start New Session</button></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const $=s=>document.querySelector(s);const DB='snaprecruit-v11',STORE='session';const state={items:[],index:0,added:0,notFound:0,skipped:0};const STOP=/^(follow|following|followers|posts|message|profile|private|suggested|instagram|home|search|reels|meta|contact|email|edit|share|seeall)$/i;function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function save(){const db=await openDB(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({items:state.items.map(x=>({file:x.file,ig:x.ig,name:x.name,snap:x.snap})),index:state.index,added:state.added,notFound:state.notFound,skipped:state.skipped},'current');return new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)})}async function load(){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get('current');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}async function clearSaved(){const db=await openDB(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('current');return new Promise(r=>tx.oncomplete=r)}function cleanHandle(s){return String(s||'').trim().replace(/^@/,'').replace(/\s+/g,'').replace(/[^A-Za-z0-9._-]/g,'').replace(/^[._-]+|[._-]+$/g,'').replace(/[._-]{3,}/g,m=>m[0].repeat(2)).slice(0,30)}function validHandle(s){return s&&s.length>2&&s.length<=30&&!STOP.test(s)&&/[a-z]/i.test(s)&&/^[A-Za-z0-9._-]+$/.test(s)&&!/^\d+$/.test(s)&&!/[A-Z]{4,}/.test(s)}function titleCase(s){return s.toLowerCase().replace(/(^|\s|[-'])[a-zà-ÿ]/g,m=>m.toUpperCase())}function cleanName(s){return titleCase(String(s||'').replace(/\b(she\/her|he\/him|they\/them)\b/ig,'').replace(/[._]+/g,' ').replace(/\s*-\s*$/g,'').replace(/[^A-Za-zÀ-ÿ'’\s-]/g,' ').replace(/\s+/g,' ').trim())}function words(s){return cleanName(s).toLowerCase().split(/\s+/).filter(w=>w.length>1)}function handleWords(h){return cleanHandle(h).replace(/\d+$/,'').replace(/[._-]+/g,' ').split(/\s+/).filter(w=>w.length>1)}function nameFromHandle(h){const w=handleWords(h);return w.length>=2?titleCase(w.slice(0,3).join(' ')):''}function overlap(name,handle){const nw=words(name),h=cleanHandle(handle).toLowerCase();return nw.reduce((n,w)=>n+(h.includes(w)?1:0),0)}function plausibleName(s){const n=cleanName(s),w=words(n);return n.length>=3&&n.length<=40&&w.length>=2&&w.length<=4&&!/school|class|college|university|volleyball|soccer|lacrosse|athlete|official|link|vsco|follow|message|snap|kh[s]?|’\d\d|'\d\d/i.test(n)&&w.every(x=>/^[a-zà-ÿ'’-]+$/i.test(x))}function pickName(lines,ig){const candidates=lines.map(cleanName).filter(plausibleName).map(n=>({n,score:overlap(n,ig)*50-(n.split(/\s+/).length-2)*3})).sort((a,b)=>b.score-a.score);if(candidates[0]&&candidates[0].score>=50)return candidates[0].n;const derived=nameFromHandle(ig);if(derived)return derived;return candidates[0]?.score>=0?candidates[0].n:''}function detectSnap(lines){for(const raw of lines){const m=raw.match(/(?:👻|\bsc\.?\s*[:=\-–—]?|snap(?:chat)?\s*[:=\-–—]?)[\s@]*([A-Za-z0-9._-]{3,30})/i);const s=m?cleanHandle(m[1]):'';if(validHandle(s))return s}return''}function editDistance(a,b){a=a.toLowerCase();b=b.toLowerCase();const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}function handleScore(raw,index,name){const s=cleanHandle(raw);if(!validHandle(s)||/(follow|message|profile|prospectwatch|followers|following|posts)/i.test(s))return null;let score=100-index*4;if(raw.includes('@'))score+=18;if(s===s.toLowerCase())score+=8;if(/[._]/.test(s))score+=5;if(name){const expected=words(name).join('');const compact=s.toLowerCase().replace(/[^a-z]/g,'').replace(/\d+$/,'');if(expected){score+=Math.max(0,35-editDistance(compact,expected)*6);if(overlap(name,s))score+=30}}if(/[A-Z]/.test(s))score-=18;if(/[Il1O0]{3,}/.test(s))score-=18;return{s,score}}function pickIG(lines,name){const ranked=lines.map((x,i)=>handleScore(x,i,name)).filter(Boolean).sort((a,b)=>b.score-a.score);if(!ranked.length)return'';if(ranked[0].score<95)return'';return ranked[0].s}async function crop(file,kind){const b=await createImageBitmap(file),w=b.width,h=b.height;let x=.16*w,y=.012*h,ww=.68*w,hh=.065*h,max=1650;if(kind==='handleWide'){x=.08*w;y=.005*h;ww=.84*w;hh=.09*h}else if(kind==='displayName'){x=.20*w;y=.075*h;ww=.68*w;hh=.075*h}else if(kind==='bio'){x=.04*w;y=.105*h;ww=.92*w;hh=.22*h}const scale=Math.min(1,max/ww),c=document.createElement('canvas');c.width=Math.max(1,Math.round(ww*scale));c.height=Math.max(1,Math.round(hh*scale));const g=c.getContext('2d',{alpha:false});g.imageSmoothingQuality='high';g.filter=kind==='bio'?'grayscale(1) contrast(1.35)':'grayscale(1) contrast(2)';g.drawImage(b,x,y,ww,hh,0,0,c.width,c.height);return c}function suggestions(){const name=cleanName($('#name').value),ig=cleanHandle($('#ig').value),snap=cleanHandle($('#snap').value),p=name.toLowerCase().split(/\s+/).filter(Boolean),out=[];if(snap)out.push(snap);if(p.length>=2){const f=p[0],l=p.at(-1);out.push(`${f}.${l}`,`${f}_${l}`,`${f}-${l}`,`${f}${l}`)}if(ig)out.push(ig);return[...new Set(out.filter(validHandle))]}async function launchSnapchat(handle){if(handle)await navigator.clipboard.writeText(handle);const a=document.createElement('a');a.href='snapchat://';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}function renderOptions(){const opts=suggestions();$('#options').innerHTML=opts.length?opts.map(h=>`<button class="option" data-h="${h}"><span class="handle">${h}</span><span class="action">Copy + Open ↗</span></button>`).join(''):'<div class="card" style="color:#999">Correct the Instagram handle or full name to create suggestions.</div>'}function show(){if(state.index>=state.items.length){$('#review').style.display='none';$('#upload').style.display='none';$('#done').style.display='block';$('#summary').textContent=`${state.added} added • ${state.notFound} not found • ${state.skipped} skipped`;$('#count').textContent='0 remaining';clearSaved();return}const x=state.items[state.index];$('#review').style.display='block';$('#upload').style.display='none';$('#done').style.display='none';$('#shot').src=URL.createObjectURL(x.file);$('#ig').value=x.ig||'';$('#name').value=x.name||'';$('#snap').value=x.snap||'';$('#count').textContent=`${state.items.length-state.index} remaining`;renderOptions();scrollTo(0,0)}async function next(type){const x=state.items[state.index];x.ig=$('#ig').value;x.name=$('#name').value;x.snap=$('#snap').value;if(type==='added')state.added++;if(type==='notFound')state.notFound++;if(type==='skip')state.skipped++;state.index++;await save();show()}$('#files').onchange=async e=>{state.items=[...e.target.files].map(file=>({file,ig:'',name:'',snap:''}));state.index=state.added=state.notFound=state.skipped=0;$('#status').textContent=`${state.items.length} screenshot(s) ready.`;$('#count').textContent=`${state.items.length} remaining`;await save()};$('#scan').onclick=async()=>{if(!state.items.length)return alert('Choose screenshots first.');$('#scan').disabled=true;let w;try{$('#status').textContent='Loading reader…';w=await Tesseract.createWorker('eng');for(let i=0;i<state.items.length;i++){const x=state.items[i];$('#status').textContent=`Reading ${i+1} of ${state.items.length}: display name…`;await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ '-"});const nr=await w.recognize(await crop(x.file,'displayName'));const nameLines=(nr.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);const initialName=nameLines.map(cleanName).find(plausibleName)||'';$('#status').textContent=`Reading ${i+1} of ${state.items.length}: Instagram handle…`;await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-'});const h1=await w.recognize(await crop(x.file,'handle'));const h2=await w.recognize(await crop(x.file,'handleWide'));const handleLines=[...(h1.data.text||'').split(/\n/),...(h2.data.text||'').split(/\n/)].map(v=>v.trim()).filter(Boolean);x.ig=pickIG(handleLines,initialName);$('#status').textContent=`Reading ${i+1} of ${state.items.length}: profile details…`;await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:''});const br=await w.recognize(await crop(x.file,'bio'));const bioLines=(br.data.text||'').split(/\n/).map(v=>v.trim()).filter(Boolean);x.name=pickName([...nameLines,...bioLines],x.ig);x.snap=detectSnap(bioLines);await save()}$('#status').textContent='Ready.';show()}catch(e){$('#status').textContent='Reader error: '+e.message}finally{if(w)await w.terminate();$('#scan').disabled=false}};$('#options').onclick=e=>{const b=e.target.closest('[data-h]');if(b)launchSnapchat(b.dataset.h)};['ig','name','snap'].forEach(id=>$('#'+id).addEventListener('input',async()=>{const x=state.items[state.index];x[id]=$('#'+id).value;renderOptions();await save()}));$('#openOnly').onclick=()=>launchSnapchat('');$('#added').onclick=()=>next('added');$('#notFound').onclick=()=>next('notFound');$('#skip').onclick=()=>next('skip');$('#back').onclick=()=>{if(state.index>0){state.index--;save();show()}else history.back()};$('#newSession').onclick=async()=>{await clearSaved();location.reload()};$('#resume').onclick=()=>show();(async()=>{const saved=await load();if(saved&&saved.items?.length){Object.assign(state,saved);$('#resume').style.display='block';$('#status').textContent=`Saved session found: ${state.items.length-state.index} remaining.`;$('#count').textContent=`${state.items.length-state.index} remaining`}})();</script></body></html>

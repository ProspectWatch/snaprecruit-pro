[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/read-profile"
  to = "/.netlify/functions/read-profile"
  status = 200

[[redirects]]
  from = "/snaprecruit"
  to = "/snaprecruit.html"
  status = 200

[[redirects]]
  from = "/snaprecruit/*"
  to = "/snaprecruit.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

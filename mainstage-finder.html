<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1018"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MainStage Athlete Finder</title><style>:root{--bg:#080b10;--panel:#111720;--line:#273241;--text:#eef1f5;--muted:#98a3b2;--bronze:#b99046;--bronze2:#c9aa6a;--blue:#3d5f83}*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#0c1119,#07090d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100%}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 90px)}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#121821;color:#fff;font-size:24px}.brand h1{margin:0;font-size:22px}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:15px}label{display:block;color:#c8d0da;font-weight:700;margin-bottom:8px}textarea,input{width:100%;background:#080b10;border:1px solid #344152;color:#fff;border-radius:13px;padding:13px;font:inherit}textarea{min-height:210px;resize:vertical}.hint{color:var(--muted);font-size:13px;line-height:1.45}.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:850}.primary{background:linear-gradient(135deg,var(--bronze),var(--bronze2));color:#15100a}.secondary{background:#182231;border:1px solid #34475f;color:#fff;margin-top:10px}.review{display:none}.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.name{font-size:29px;font-weight:900;margin:3px 0 16px}.option{width:100%;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#111923;border:1px solid #303d4e;border-radius:15px;padding:12px;margin-bottom:10px}.handle{font-weight:800;overflow-wrap:anywhere;text-align:left}.small{border:0;border-radius:10px;padding:10px 12px;font-weight:800}.ig{background:#273d57;color:#fff}.snap{background:var(--bronze);color:#15100a}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.controls button{border:1px solid var(--line);background:#151c26;color:#fff;border-radius:14px;padding:14px;font-weight:800}.done{display:none;text-align:center;padding:60px 10px}.badge{display:inline-block;border:1px solid #354253;border-radius:999px;padding:7px 10px;color:var(--bronze2);font-size:12px;margin-bottom:14px}</style></head><body><main class="app"><header><button class="back" onclick="location.href='/'">‹</button><div class="brand"><h1>MainStage Athlete Finder</h1><p>Generate likely Instagram and Snapchat usernames</p></div></header><section id="setup"><div class="panel"><div class="badge">MAINSTAGE MEDIA</div><label for="list">Athlete list</label><textarea id="list" placeholder="One athlete per line&#10;&#10;Taylor Smith&#10;Jordan Lee&#10;Avery McDonald"></textarea><p class="hint">Paste one full name per line. Commas, tabs, jersey numbers and extra columns are accepted; the app uses the first plausible two-to-four-word name on each line.</p><button id="start" class="btn primary">Build Search List</button><button id="resume" class="btn secondary" style="display:none">Resume Saved List</button></div></section><section id="review" class="review"><div class="progress" id="progress"></div><div class="panel"><div class="name" id="athleteName"></div><div id="options"></div><div class="controls"><button id="previous">Previous</button><button id="next">Next Athlete</button></div></div></section><section id="done" class="done"><h2>List Complete</h2><p id="summary"></p><button class="btn primary" id="restart">Start New List</button></section></main><script>const $=s=>document.querySelector(s);const KEY='mainstage-athlete-finder-v1';const state={names:[],index:0};function cleanLine(line){let s=line.trim().replace(/^\d+[.)#-]*\s*/,"");const cells=s.split(/[\t,;|]+/).map(x=>x.trim()).filter(Boolean);for(const c of cells){const m=c.match(/[A-Za-zÀ-ÿ'’-]+(?:\s+[A-Za-zÀ-ÿ'’-]+){1,3}/);if(m)return m[0].replace(/\s+/g,' ').trim()}const m=s.match(/[A-Za-zÀ-ÿ'’-]+(?:\s+[A-Za-zÀ-ÿ'’-]+){1,3}/);return m?m[0].replace(/\s+/g,' ').trim():''}function slugPart(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}function optionsFor(name){const p=name.split(/\s+/).filter(Boolean),f=slugPart(p[0]||''),l=slugPart(p.at(-1)||'');if(!f||!l)return[];return[`${f}.${l}`,`${f}_${l}`,`${f}-${l}`,`${f}${l}`]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function render(){if(state.index>=state.names.length){$('#review').style.display='none';$('#done').style.display='block';$('#summary').textContent=`${state.names.length} athletes reviewed.`;return}$('#setup').style.display='none';$('#done').style.display='none';$('#review').style.display='block';const name=state.names[state.index],opts=optionsFor(name);$('#progress').textContent=`Athlete ${state.index+1} of ${state.names.length}`;$('#athleteName').textContent=name;$('#options').innerHTML=opts.map(h=>`<div class="option"><div class="handle">${h}</div><button class="small ig" data-ig="${h}">Instagram</button><button class="small snap" data-snap="${h}">Snapchat</button></div>`).join('');save();scrollTo(0,0)}async function copy(v){try{await navigator.clipboard.writeText(v)}catch{}}function openInstagram(h){copy(h);window.open(`https://www.instagram.com/explore/search/keyword/?q=${encodeURIComponent(h)}`,'_blank','noopener,noreferrer')}function openSnap(h){copy(h);const a=document.createElement('a');a.href='snapchat://';a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}$('#start').onclick=()=>{const names=[...new Set($('#list').value.split(/\r?\n/).map(cleanLine).filter(Boolean))];if(!names.length)return alert('Paste at least one athlete name.');state.names=names;state.index=0;save();render()};$('#options').onclick=e=>{const ig=e.target.closest('[data-ig]'),sn=e.target.closest('[data-snap]');if(ig)openInstagram(ig.dataset.ig);if(sn)openSnap(sn.dataset.snap)};$('#next').onclick=()=>{state.index++;render()};$('#previous').onclick=()=>{if(state.index>0)state.index--;render()};$('#restart').onclick=()=>{localStorage.removeItem(KEY);location.reload()};$('#resume').onclick=()=>render();const saved=load();if(saved?.names?.length){Object.assign(state,saved);$('#resume').style.display='block'}</script></body></html>

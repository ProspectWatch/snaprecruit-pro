<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MainStage Athlete Finder</title><style>:root{--bg:#000;--panel:#101216;--panel2:#15181e;--line:#2c3139;--text:#f5f6f7;--muted:#9ba3ad;--teal:#00a9b7;--red:#e24a4a;--soft:#242932;--green:#245b44}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100%}body{min-height:100vh}.app{max-width:860px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 100px)}header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.back{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#111419;color:#fff;font-size:24px}.brandmark{flex:1}.mainWord{font-weight:1000;font-style:italic;letter-spacing:-2px;font-size:27px;line-height:.9}.mainWord .red{color:var(--red)}.media{font-weight:950;font-style:italic;letter-spacing:7px;font-size:13px;margin-top:5px}.stripe{height:3px;margin-top:6px;background:linear-gradient(90deg,var(--teal) 0 49%,#fff 49% 51%,var(--red) 51%)}.tagline{font-size:11px;letter-spacing:5px;color:#d0d3d7;margin-top:5px}.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:17px;margin-bottom:14px}label{display:block;color:#d5d9df;font-weight:750;margin-bottom:8px}textarea,input,select{width:100%;background:#08090b;border:1px solid #39404a;color:#fff;border-radius:13px;padding:13px;font:inherit}textarea{min-height:230px;resize:vertical}.hint{color:var(--muted);font-size:13px;line-height:1.45}.btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:900}.primary{background:linear-gradient(90deg,var(--teal),#058492);color:white}.secondary{background:#1a1e24;border:1px solid #38404a;color:#fff;margin-top:10px}.review{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#111419;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}.stat strong{display:block;font-size:20px}.stat span{color:var(--muted);font-size:11px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.progress{color:var(--muted);font-size:14px;margin-bottom:10px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.tag{border:1px solid #3b4652;background:#15191f;border-radius:999px;padding:6px 9px;color:#c7d0db;font-size:12px}.name{font-size:31px;font-weight:950;margin:3px 0 8px}.school{color:#c3cad3;font-size:16px;margin-bottom:16px}.option{width:100%;display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;background:#111419;border:1px solid #303741;border-radius:15px;padding:12px;margin-bottom:10px}.handle{font-weight:850;overflow-wrap:anywhere;text-align:left}.small{border:0;border-radius:10px;padding:10px 11px;font-weight:850}.ig{background:#26384d;color:#fff}.snap{background:var(--teal);color:#fff}.google{background:#2c3036;color:#fff}.statusRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.statusRow button{border:1px solid var(--line);border-radius:13px;padding:12px 6px;color:#fff;font-weight:850;background:#171b21}.statusRow .searching{background:#24404f}.statusRow .found{background:var(--green)}.statusRow .no{background:#60383d}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.controls button{border:1px solid var(--line);background:#171b21;color:#fff;border-radius:14px;padding:14px;font-weight:850}.done{display:none;text-align:center;padding:60px 10px}.badge{display:inline-block;border:1px solid #36404a;border-radius:999px;padding:7px 10px;color:#bfc6ce;font-size:12px;margin-bottom:14px}.accent{color:var(--teal)}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.option{grid-template-columns:1fr 1fr 1fr}.handle{grid-column:1/-1}.toolbar{grid-template-columns:1fr}.statusRow{grid-template-columns:1fr 1fr}}</style></head><body><main class="app"><header><button class="back" onclick="location.href='/'">‹</button><div class="brandmark"><div class="mainWord">MAIN <span class="red">STAGE</span></div><div class="media">MEDIA</div><div class="stripe"></div><div class="tagline">ELEVATE YOUR BRAND</div></div></header><section id="setup"><div class="panel"><div class="badge">ATHLETE DISCOVERY WORKSPACE</div><label for="list">Athlete list</label><textarea id="list" placeholder="Dalainee Perry (UTEP)    Volleyball&#10;Danielle Robbie (Becker)    Volleyball"></textarea><p class="hint">Paste names with school/team and sport. Tabs, commas, numbered rows and category headings are supported. Duplicate athlete and school combinations are removed.</p><button id="start" class="btn primary">Build Prospect List</button><button id="resume" class="btn secondary" style="display:none">Resume Saved Workspace</button></div></section><section id="review" class="review"><div class="stats"><div class="stat"><strong id="total">0</strong><span>Total</span></div><div class="stat"><strong id="foundCount">0</strong><span>Found</span></div><div class="stat"><strong id="notFoundCount">0</strong><span>Not Found</span></div><div class="stat"><strong id="remaining">0</strong><span>Remaining</span></div></div><div class="toolbar"><select id="sportFilter"><option value="all">All sports</option></select><select id="statusFilter"><option value="all">All statuses</option><option value="not-started">Not Started</option><option value="searching">Searching</option><option value="found">Found</option><option value="not-found">Not Found</option></select></div><div class="progress" id="progress"></div><div class="panel"><div class="meta"><span class="tag" id="sportTag"></span><span class="tag" id="statusTag"></span></div><div class="name" id="athleteName"></div><div class="school" id="school"></div><div id="options"></div><div class="statusRow"><button data-status="not-started">Not Started</button><button class="searching" data-status="searching">Searching</button><button class="found" data-status="found">Found</button><button class="no" data-status="not-found">Not Found</button></div><div class="controls"><button id="previous">Previous</button><button id="next">Next Athlete</button></div></div></section><section id="done" class="done"><h2>List Complete</h2><p id="summary"></p><button class="btn primary" id="restart">Start New List</button></section></main><script>const $=s=>document.querySelector(s);const KEY='mainstage-athlete-finder-v2';const state={athletes:[],filtered:[],index:0,sport:'all',status:'all'};function normalize(s){return String(s||'').replace(/[–—]/g,'-').replace(/\s+/g,' ').trim()}function parseLine(line){let raw=normalize(line.replace(/^\d+[.)#-]*\s*/,''));if(!raw)return null;const tab=raw.split(/\t+/).map(normalize).filter(Boolean);let sport=tab.length>1?tab.at(-1):'';let left=tab[0]||raw;if(!/[A-Za-zÀ-ÿ'’-]+\s+[A-Za-zÀ-ÿ'’-]+/.test(left))return null;const schoolMatch=left.match(/\(([^()]*)\)/);const school=schoolMatch?normalize(schoolMatch[1]):'';let name=normalize(left.replace(/\([^()]*\)/g,'').replace(/\bNCAA\b/ig,'').replace(/\bVolleyball|Track-XC|Tennis|Swim-Dive|Softball|Soccer Professionals|Soccer|Lacrosse|Ice Hockey|Gymnastics|Golf|Field Hockey|Dance Team|Cheerleading|Basketball|Pro Cheerleaders|Fighters|College Etc|Pro Etc|Fitwins\b/ig,''));const m=name.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.-]*(?:\s+[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ'’.-]*){1,4}/);name=m?normalize(m[0]):'';if(!name)return null;if(!sport&&tab.length>1)sport=tab.at(-1);return{name,school,sport:normalize(sport||'Uncategorized'),status:'not-started'}}function slug(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}function handles(name){const p=name.split(/\s+/).filter(Boolean),f=slug(p[0]||''),l=slug(p.at(-1)||'');if(!f||!l)return[];return[`${f}.${l}`,`${f}_${l}`,`${f}-${l}`,`${f}${l}`]}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function applyFilters(){state.filtered=state.athletes.map((a,i)=>({...a,_i:i})).filter(a=>(state.sport==='all'||a.sport===state.sport)&&(state.status==='all'||a.status===state.status));if(state.index>=state.filtered.length)state.index=Math.max(0,state.filtered.length-1)}function counts(){const f=state.athletes.filter(a=>a.status==='found').length,n=state.athletes.filter(a=>a.status==='not-found').length,r=state.athletes.filter(a=>!['found','not-found'].includes(a.status)).length;$('#total').textContent=state.athletes.length;$('#foundCount').textContent=f;$('#notFoundCount').textContent=n;$('#remaining').textContent=r}function render(){applyFilters();counts();$('#setup').style.display='none';$('#review').style.display='block';if(!state.filtered.length){$('#progress').textContent='No athletes match these filters.';$('#athleteName').textContent='No Results';$('#school').textContent='Change the sport or status filter.';$('#options').innerHTML='';return}const a=state.filtered[state.index];$('#progress').textContent=`Athlete ${state.index+1} of ${state.filtered.length} in current view`;$('#athleteName').textContent=a.name;$('#school').textContent=a.school||'School/team not listed';$('#sportTag').textContent=a.sport;$('#statusTag').textContent=a.status.replace('-',' ');$('#options').innerHTML=handles(a.name).map(h=>`<div class="option"><div class="handle">${h}</div><button class="small ig" data-ig="${h}">Instagram</button><button class="small snap" data-snap="${h}">Snapchat</button><button class="small google" data-google="${h}">Google</button></div>`).join('');save();scrollTo(0,0)}async function copy(v){try{await navigator.clipboard.writeText(v)}catch{}}function openIG(h,a){copy(h);window.open(`https://www.google.com/search?q=${encodeURIComponent('site:instagram.com '+a.name+' '+a.school+' '+h)}`,'_blank','noopener,noreferrer')}function openSnap(h){copy(h);const a=document.createElement('a');a.href='snapchat://';a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}function openGoogle(h,a){copy(h);window.open(`https://www.google.com/search?q=${encodeURIComponent(a.name+' '+a.school+' '+a.sport+' instagram snapchat '+h)}`,'_blank','noopener,noreferrer')}$('#start').onclick=()=>{const parsed=$('#list').value.split(/\r?\n/).map(parseLine).filter(Boolean),seen=new Set();state.athletes=parsed.filter(a=>{const k=(a.name+'|'+a.school).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});if(!state.athletes.length)return alert('Paste at least one athlete name.');const sports=[...new Set(state.athletes.map(a=>a.sport))].sort();$('#sportFilter').innerHTML='<option value="all">All sports</option>'+sports.map(s=>`<option>${s}</option>`).join('');state.index=0;state.sport=state.status='all';save();render()};$('#options').onclick=e=>{const a=state.filtered[state.index];const ig=e.target.closest('[data-ig]'),sn=e.target.closest('[data-snap]'),g=e.target.closest('[data-google]');if(ig)openIG(ig.dataset.ig,a);if(sn)openSnap(sn.dataset.snap);if(g)openGoogle(g.dataset.google,a)};document.querySelector('.statusRow').onclick=e=>{const b=e.target.closest('[data-status]');if(!b||!state.filtered.length)return;const a=state.filtered[state.index];state.athletes[a._i].status=b.dataset.status;save();render()};$('#next').onclick=()=>{if(state.index<state.filtered.length-1)state.index++;render()};$('#previous').onclick=()=>{if(state.index>0)state.index--;render()};$('#sportFilter').onchange=e=>{state.sport=e.target.value;state.index=0;render()};$('#statusFilter').onchange=e=>{state.status=e.target.value;state.index=0;render()};$('#restart').onclick=()=>{localStorage.removeItem(KEY);location.reload()};$('#resume').onclick=()=>{const sports=[...new Set(state.athletes.map(a=>a.sport))].sort();$('#sportFilter').innerHTML='<option value="all">All sports</option>'+sports.map(s=>`<option>${s}</option>`).join('');$('#sportFilter').value=state.sport||'all';$('#statusFilter').value=state.status||'all';render()};const saved=load();if(saved?.athletes?.length){Object.assign(state,saved);$('#resume').style.display='block'}</script></body></html>
